---
name: Lint Shell scripts on Pull Requests

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          list-files: shell
          filters: |
            shell:
              - added|modified: "**.sh"
      - name: Lint files
        if: ${{ steps.filter.outputs.shell == 'true' }}
        uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1
        with:
          shellcheck_flags: "${{ steps.filter.outputs.shell_files }}"
